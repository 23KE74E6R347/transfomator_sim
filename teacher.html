<!doctype html>

    <title>Transformator – Lehrkraftzugang</title>
    <style>
      body {
        margin: 0;
        background: #f4f6f8;

        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 520px;
        margin: 10vh auto;

      }
      .card {
        background: #fff;
        border: 1px solid #d7dce2;
        border-radius: 14px;
        padding: 22px;
      }
      h1 {
        margin-top: 0;
      }
      p {
        line-height: 1.45;
        color: #59636f;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #b9c1c9;
        border-radius: 8px;
        font-size: 1rem;
        margin: 8px 0 12px;
      }
      button {
        border: 0;
        border-radius: 9px;
        padding: 11px 15px;
        background: #263d53;
        color: #fff;
        cursor: pointer;
      }
      .error {

      }

      .editor {

      }
      .editor h2 {
        margin-top: 0;
      }
      .editor p.small {
        color: #59636f;
        font-size: 0.9rem;
      }
      .taskEditor {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid #d7dce2;
      }
      .taskEditor h3 {
        margin: 0 0 10px;
      }
      .taskEditor label {
        display: block;
        margin: 10px 0;
        color: #18202a;
        font-weight: 600;
      }
      .taskEditor input,
      .taskEditor textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #b9c1c9;
        border-radius: 8px;
        background: #fff;
        color: #18202a;
        font: inherit;
      }
      .taskEditor textarea {
        min-height: 80px;
        resize: vertical;
        line-height: 1.4;
      }
      .editorActions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .editorStatus {
        min-height: 1.4em;
        margin-top: 9px;
        color: #36735a;
        font-size: 0.9rem;
      }
      @media (max-width: 500px) {
        .editorActions button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Lehrkraftbereich</h1>
        <p>Erwartungsbild und interne Hinweise zur Unterrichtsvorbereitung.</p>
        <label for="pw">Passwort</label
        ><input id="pw" type="password" autocomplete="off" autofocus /><button
          id="unlock"
        >
          Lehrkraftbereich öffnen
        </button>
        <div id="error" class="error" role="alert"></div>
        <a class="back" href="index.html">← Zur Simulation</a>
      </div>
    </main>
    <script>
      // Encrypted Login Key
      const DATA = {

          "t3GFMxS4GKOdZRhT4uhM0JXBD+0VawYgPuEtRNZ2bB2xwPoY1CP5UMknZ+VKE2e6oSHROdRHkuQVr4gpNZLRTMBmDrUqwXiI9l+5V0p6CeGyd4k3EXSnp/Si5R/e62JrLutry1QhqpPpnw7yCNUWZL5POddkbgC9WolXlghXWjIWn61Ms9TJ/JYZjaXr2iwKu4QrV7667chzLHb5T+6oWET1R/gq7rrJvSLfJlSXHgfk+9BpXWXkZfKNZJnIWv5k2HQzsVDCvG+G5P00f3PjLKUw4bmx0KKb03RZbztzcvOnoziv4fAf2nUECztwaWwQWOZOojVgF6kMAHZu/RFr4slqY7F7+cr7XgerNJyLE86o7dO664SLHf4UenrweClww/DOcSITiCKvvoj7IbYv+hK1crejK2uktrQAxk1+Nb/Ur3tYwlDdVVScTOLqrHFOajQH6TXwJhThP2U9YuCtKzMZgpFcwIdGALh1Wwx0F9urOe21pnJC/J6lltJ1ZGdFkbSlEl+Lk6JtCJ5iL9mOGMZklH2CEzeLU7sHFoILTy/hCbwhvoH81adTfgp/mZoBy8QXRwH7cRQD6HEgaLt0cJcEDoqwulzxcsNa/YdHTp6oSqLdN23dmS0cDRETimALyQmaApnebwGGDIUXki3H3KJVxn6eLLjT9TS2Iakkchyeu126KUTcT4clwGh/Zzy4r/Wx6BxvQCO/DOQCVhfIUhVui/Tq1pbBjdo0Ek6Fsrqa5iKxKZZXTpNflY8KMdw7XnOBux+RrZTwD9q3VF7j2ETr11JEuBnwjqgiUA/dsNexjJsiNfgIpcTfeF9Qf7SHHg8SCgJXMrpddUOvTRUdtAvinyHivw+Z0rRWLpYpgKsAahPdY/tpEzjieE140zeyUGEQHIA9zyihFVU30LjLCqYwS3fH/49tEizYEvINKDKU8tvVq7Pr7nAajKFiKKAWf/MI08Ywmo2g15xXEh1QvST1Vxj5RcMbC9Keg4fT7TwVAG3JOEsUsYZWSonjgw8mVXY5t4SuIgHjZ8+ZaTkdfPCMGvfCCumT33ONjLPiposAp6LR+KtMv0kdh17A6Xtx31Bb8bTt0RMRne6MNskkn+yyuSpRf8JfLh+SZWJD4Jy8ifsO3BjB1LLmqnZnhWeWlK0JbfLYo/MhHcG/OWLQM3+rb7XbbujQGoFg5tT24i9iZlcRFwn0XAoBEgDzz5t/VILckW28cUScngs1KtXiBIEjR6UVijfq+mhCI34gsNPdokJfcgI6ZhfGtWqGXX03zKHHJfdbjC59nO/thHk2sqlzzIF6pfmhGKRi3BNwKcDxmLLZdOoICwYiIQQhpLPCNuierBJXZZRrwlscCaO6EBYWUjEimoDBO6+REa4ZputiiVRJIVgteqOJB/5pdIoUvFEPifRw/Ok0a3wOWdCVzOeLBNBIWS8BtAgk+QW8lCAd4DY8CEjJP1muJ41yA7jUCuhSpY06IOrsr3jv28JU1u8Vyt3Vi5qIe8BvpUeQnJLYGY3qCVxTPpvZDFmemXkwuiOC7TG+7VoUHOlLs2zll168tXza6A==",
        iterations: 600000,
      };
      function b64(s) {
        const x = atob(s),
          a = new Uint8Array(x.length);
        for (let i = 0; i < x.length; i++) a[i] = x.charCodeAt(i);
        return a;
      }
      // Decrypt and Display Logic
      async function openTeacher() {
        const pw = document.getElementById("pw").value,
          e = document.getElementById("error");
        e.textContent = "";
        if (!pw) {
          e.textContent = "Bitte Passwort eingeben.";
          return;
        }
        try {
          const m = await crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(pw),
            "PBKDF2",
            false,
            ["deriveKey"],
          );
          const k = await crypto.subtle.deriveKey(
            {
              name: "PBKDF2",
              salt: b64(DATA.salt),
              iterations: DATA.iterations,
              hash: "SHA-256",
            },
            m,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"],
          );
          const d = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: b64(DATA.iv) },
            k,
            b64(DATA.ciphertext),
          );
          const s = new Blob([d])
            .stream()
            .pipeThrough(new DecompressionStream("gzip"));
          const html = await new Response(s).text();
          // Die entschlüsselte Lehrkraftseite direkt ins bestehende Dokument übernehmen.
          // document.write() ist hier absichtlich raus: Nach dem initialen Laden kann
          // document.write() das Dokument ersetzen, bevor der Editor sauber aufgebaut ist.
          const parsed = new DOMParser().parseFromString(html, "text/html");

          // Die entschlüsselte Lehrkraftseite enthält ihr eigenes CSS im <head>.
          // Beim bisherigen Einsetzen wurde nur der <body> übernommen.
          // Dadurch ging die komplette Formatierung der Erwartungsbild-Seite verloren.
          // Deshalb übernehmen wir zuerst alle Stylesheets und <style>-Blöcke
          // aus dem entschlüsselten Dokument und setzen erst danach den Body ein.
          parsed.head
            .querySelectorAll('style, link[rel="stylesheet"]')
            .forEach((node) => {
              document.head.appendChild(node.cloneNode(true));
            });

          document.title = parsed.title || document.title;
          document.body.innerHTML = parsed.body.innerHTML;

          const editorStyle = document.createElement("style");
          editorStyle.textContent = `
            .taskEditorCard {
              margin-top: 16px;
            }

            .taskEditor {
              margin-top: 14px;
              padding-top: 14px;
              border-top: 1px solid #d7dce2;
            }

            .taskEditor h3 {
              margin: 0 0 10px;
            }

            .taskEditor label {
              display: block;
              margin: 10px 0;
              color: #18202a;
              font-weight: 600;
            }

            .taskEditor input,
            .taskEditor textarea {
              width: 100%;
              box-sizing: border-box;
              padding: 10px;
              margin-top: 5px;
              border: 1px solid #b9c1c9;
              border-radius: 8px;
              background: #fff;
              color: #18202a;
              font: inherit;
            }

            .taskEditor textarea {
              min-height: 80px;
              resize: vertical;
              line-height: 1.4;
            }

            .editorActions {
              display: flex;
              gap: 8px;
              flex-wrap: wrap;
              margin-top: 14px;
            }

            .editorStatus {
              min-height: 1.4em;
              margin-top: 9px;
              color: #36735a;
              font-size: 0.9rem;
            }

            @media (max-width: 500px) {
              .editorActions button {
                width: 100%;
              }
            }
          `;
          document.head.appendChild(editorStyle);

          const editorCard = document.createElement("section");
          editorCard.className = "card taskEditorCard";
          editorCard.innerHTML = `
            <h2>Arbeitsaufgaben bearbeiten</h2>
            <p class="small">
              Hier kannst du die sechs Untersuchungsaufträge der Simulation anpassen.
              Die Darstellung auf der Startseite bleibt dabei gleich.
            </p>
            <p class="small">
              <b>Wichtig:</b> Die Änderungen werden nur in diesem Browser gespeichert.
              Der GitHub-Code selbst wird dadurch nicht verändert.
            </p>
            <div id="taskEditor"></div>
            <div class="editorActions">
              <button id="saveTasks" type="button">Arbeitsaufgaben speichern</button>
              <button id="resetTasks" type="button">Standardtexte wiederherstellen</button>
            </div>
            <div id="editorStatus" class="editorStatus" role="status"></div>
          `;
          document.body.appendChild(editorCard);

          const DEFAULT_TASKS_EDITOR = {
            A: {
              title: "A – Spannungstransformation",
              prediction: "Was passiert mit U₂, wenn du N₂ vergrößerst?",
              investigation:
                "Stelle N₁ = 200 und U₁ = 12 V ein. Verändere nur N₂ und nimm mehrere Messwerte auf.",
              explain: "Welche Beziehung zwischen U₂ und N₂ erkennst du?",
            },
            B: {
              title: "B – Stromtransformation",
              prediction:
                "Wie verändert sich der Strom, wenn du das Windungsverhältnis änderst?",
              investigation:
                "Schalte auf „belastet“ und vergleiche mindestens zwei Windungsverhältnisse.",
              explain: "Nutze die Leistungsübertragung im Idealmodell.",
            },
            C: {
              title: "C – Leerlauf und Belastung",
              investigation:
                "Vergleiche denselben Transformator zuerst „unbelastet“, dann „belastet“.",
              observe:
                "Welche Größen ändern sich? Welche bleiben im Idealmodell gleich?",
              explain: "Was bedeutet „belastet“ physikalisch?",
            },
            D: {
              title: "D – Last",
              prediction: "Was passiert mit I₂, wenn R₍Last₎ kleiner wird?",
              investigation:
                "Halte U₁, N₁ und N₂ fest und verringere R₍Last₎.",
              explain: "Warum sinkt im Realmodell gleichzeitig U₂?",
            },
            E: {
              title: "E – Wechselspannung und Gleichspannung",
              investigation:
                "Vergleiche „Wechselspannung“ und „Gleichspannung“ bei gleicher Einstellung.",
              explain:
                "Warum benötigt der Transformator eine zeitliche Änderung des magnetischen Flusses?",
            },
            F: {
              title: "F – Modellkritik",
              body:
                "Benenne mindestens zwei Annahmen des Idealmodells und zwei Dinge, die das vereinfachte Realmodell ebenfalls nicht abbildet.",
            },
          };

          function loadEditorTasks() {
            try {
              const saved = JSON.parse(
                localStorage.getItem("transformatorTasks") || "null",
              );
              const tasks = structuredClone(DEFAULT_TASKS_EDITOR);

              if (saved) {
                for (const key of Object.keys(tasks)) {
                  if (saved[key]) {
                    tasks[key] = { ...tasks[key], ...saved[key] };
                  }
                }
              }

              return tasks;
            } catch {
              return structuredClone(DEFAULT_TASKS_EDITOR);
            }
          }

          const fields = {
            A: [
              ["title", "Überschrift"],
              ["prediction", "Vorhersage"],
              ["investigation", "Untersuchung"],
              ["explain", "Erkläre"],
            ],
            B: [
              ["title", "Überschrift"],
              ["prediction", "Vorhersage"],
              ["investigation", "Untersuchung"],
              ["explain", "Erkläre"],
            ],
            C: [
              ["title", "Überschrift"],
              ["investigation", "Untersuchung"],
              ["observe", "Beobachte"],
              ["explain", "Erkläre"],
            ],
            D: [
              ["title", "Überschrift"],
              ["prediction", "Vorhersage"],
              ["investigation", "Untersuchung"],
              ["explain", "Erkläre"],
            ],
            E: [
              ["title", "Überschrift"],
              ["investigation", "Untersuchung"],
              ["explain", "Erkläre"],
            ],
            F: [
              ["title", "Überschrift"],
              ["body", "Aufgabe"],
            ],
          };

          function buildEditor() {
            const tasks = loadEditorTasks();
            const root = document.getElementById("taskEditor");
            root.replaceChildren();

            for (const key of ["A", "B", "C", "D", "E", "F"]) {
              const block = document.createElement("div");
              block.className = "taskEditor";

              const heading = document.createElement("h3");
              heading.textContent = key;
              block.appendChild(heading);

              for (const [field, labelText] of fields[key]) {
                const label = document.createElement("label");
                label.textContent = labelText;

                const control =
                  field === "title"
                    ? document.createElement("input")
                    : document.createElement("textarea");

                control.value = tasks[key][field] || "";
                control.dataset.task = key;
                control.dataset.field = field;

                label.appendChild(control);
                block.appendChild(label);
              }

              root.appendChild(block);
            }
          }

          document.getElementById("saveTasks").onclick = () => {
            const tasks = loadEditorTasks();

            document
              .querySelectorAll("#taskEditor [data-task]")
              .forEach((control) => {
                tasks[control.dataset.task][control.dataset.field] = control.value;
              });

            localStorage.setItem("transformatorTasks", JSON.stringify(tasks));
            document.getElementById("editorStatus").textContent =
              "Gespeichert. Öffne die Simulation neu, um die Aufgaben zu sehen.";
          };

          document.getElementById("resetTasks").onclick = () => {
            localStorage.removeItem("transformatorTasks");
            buildEditor();
            document.getElementById("editorStatus").textContent =
              "Die Standardtexte sind wiederhergestellt.";
          };

          buildEditor();
        } catch (x) {
          e.textContent =
            "Passwort falsch oder Inhalt konnte nicht entschlüsselt werden.";
        }
      }
      document.getElementById("unlock").onclick = openTeacher;
      document.getElementById("pw").onkeydown = (e) => {
        if (e.key === "Enter") openTeacher();
      };
    </script>
  </body>
