<!doctype html><html lang="de"><head>
  <!-- Alles Nötige steckt in dieser Datei. Kein Framework, kein Build-Kram. --><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Transformator – Lehrkraftzugang</title><style>
:root {
  color-scheme: light dark;
  --bg: #f4f6f8;
  --card: #ffffff;
  --ink: #18202a;
  --muted: #59636f;
  --line: #d7dce2;
  --blue: #315f8a;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15191b;
    --card: #191e20;
    --ink: #f1eee8;
    --muted: #b8b4ac;
    --line: #3a4144;
    --blue: #82b8e6;
  }
}

* {
  box-sizing: border-box;
}

html {
  min-width: 0;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

body {
  min-width: 0;
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
  width: min(520px, 100%);
  margin: 10vh auto;
  padding: clamp(12px, 4vw, 18px);
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: clamp(16px, 4vw, 22px);
}

h1 {
  margin-top: 0;
  line-height: 1.15;
  overflow-wrap: anywhere;
}

p {
  line-height: 1.45;
  color: var(--muted);
}

input {
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  padding: 12px;
  margin: 8px 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
}

button {
  min-height: 42px;
  border: 0;
  border-radius: 9px;
  padding: 11px 15px;
  background: #263d53;
  color: #fff;
  cursor: pointer;
  font: inherit;
}

button:focus-visible,
input:focus-visible,
a:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 2px;
}

.error {
  min-height: 1.4em;
  margin-top: 10px;
  color: #d66;
}

.back {
  display: inline-block;
  margin-top: 14px;
  color: var(--blue);
}

@media (max-width: 480px) {
  main {
    margin: 5vh auto;
    padding: 10px;
  }
}
  </style></head><body>

function b64(s)
{
  const x=atob(s),a=new Uint8Array(x.length);
  for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);
  return a
}
// Passwort -> Schlüssel -> entschlüsseln -> Inhalt anzeigen.
async function openTeacher()
{
  const pw=document.getElementById("pw").value,e=document.getElementById("error");
  e.textContent="";
  if(!pw)
  {
    e.textContent="Bitte Passwort eingeben.";
    return
  }
  try
  {
    const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(DATA.salt),iterations:DATA.iterations,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["decrypt"]);
    const d=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DATA.iv)},k,b64(DATA.ciphertext));
    const s=new Blob([d]).stream().pipeThrough(new DecompressionStream("gzip"));
    document.open();
    document.write(await new Response(s).text());
    document.close()
  }
  catch(x)
  {
    e.textContent="Passwort falsch oder Inhalt konnte nicht entschlüsselt werden."
  }
}
document.getElementById("unlock").onclick=openTeacher;
document.getElementById("pw").onkeydown=e=>
{
  if(e.key==="Enter")openTeacher()
}
