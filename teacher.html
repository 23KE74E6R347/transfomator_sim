<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Transformator – Lehrkraftzugang</title>
<style>
body{margin:0;background:#f4f6f8;color:#18202a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:520px;margin:10vh auto;padding:18px}.card{background:#fff;border:1px solid #d7dce2;border-radius:14px;padding:22px}
h1{margin-top:0}p{line-height:1.45;color:#59636f}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #b9c1c9;border-radius:8px;font-size:1rem;margin:8px 0 12px}
button{border:0;border-radius:9px;padding:11px 15px;background:#263d53;color:#fff;cursor:pointer}
.error{color:#a33;margin-top:10px;min-height:1.4em}.back{display:inline-block;margin-top:14px;color:#315f8a}
</style>
</head>
<body>
<main><div class="card">
<h1>Lehrkraftbereich</h1>
<p>Dieser Bereich enthält das Erwartungsbild und interne Hinweise zur Unterrichtsvorbereitung.</p>
<label for="pw">Passwort</label>
<input id="pw" type="password" autocomplete="off" autofocus>
<button id="unlock">Lehrkraftbereich öffnen</button>
<div id="error" class="error" role="alert"></div>
<a class="back" href="index.html">← Zur Simulation</a>
</div></main>
<script>
const DATA={"salt":"zlws+wY6gSWmfPsza+gwrw==","iv":"RmmCho8fIpa1I5vf","ciphertext":"XhrSRhHVfoRi4UurX+E3cUcQtXvV4H5nQ2fLrUvPd/6JXcgijYXaIVG1dcrmAaMlcfcgbi5gKLY5bi+bucf7zNPq4iWCEex0TnEOZVlgi56tdCfCAoV9mgVEGXGTpluTRbu5dqay2RcejbHe1sKTW47Lf6jvnr129g4QVEYjHPHmWqhotDeJyrUdnEjskoMLHk4gKpoKbPKtSBcnl3YzeeitUMTpUdnwZGyHQ7yoDrqg2jk9UNbGISPg/EudafxNW289F4SRaGE0bX3","iterations":600000,"compression":"gzip"};
function b64(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function openTeacher(){
 const pw=document.getElementById("pw").value; const err=document.getElementById("error");
 err.textContent="";
 if(!pw){err.textContent="Bitte Passwort eingeben.";return}
 try{
   const keyMaterial=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
   const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(DATA.salt),iterations:DATA.iterations,hash:"SHA-256"},keyMaterial,{name:"AES-GCM",length:256},false,["decrypt"]);
   const decrypted=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DATA.iv)},key,b64(DATA.ciphertext));
   const stream=new Blob([decrypted]).stream().pipeThrough(new DecompressionStream("gzip"));
   const html=await new Response(stream).text();
   document.open();document.write(html);document.close();
 }catch(e){err.textContent="Passwort falsch oder Inhalt konnte nicht entschlüsselt werden."}
}
document.getElementById("unlock").addEventListener("click",openTeacher);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")openTeacher()});
</script>
</body>
</html>
